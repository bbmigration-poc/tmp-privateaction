name: Activate CircleCI Projects

on:
  workflow_dispatch:
    inputs:
      circleci_org:
        description: 'GitHub org (VCS org) the repos belong to, e.g. bbmigration-poc'
        required: true
      github_repos:
        description: 'Comma-separated list of repo names to activate (without org prefix)'
        required: true

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Follow projects on CircleCI
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_API_TOKEN }}
        run: |
          IFS=',' read -ra REPOS <<< "${{ inputs.github_repos }}"
          for repo in "${REPOS[@]}"; do
            repo_trimmed=$(echo "$repo" | xargs)
            [ -z "$repo_trimmed" ] && continue
            echo "Activating ${{ inputs.circleci_org }}/$repo_trimmed on CircleCI"
            curl -sS -w "\nHTTP %{http_code}\n" -X POST \
              -H "Circle-Token: $CIRCLECI_TOKEN" \
              "https://circleci.com/api/v1.1/project/gh/${{ inputs.circleci_org }}/$repo_trimmed/follow"
          done
